</style>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#00d4ff">
<meta name="apple-mobile-web-app-title" content="Klou POS">

</head><body><div id="root"></div><script type="text/babel">
const {useState,useRef,useEffect,useCallback,useMemo}=React;
const C={bg:"#080c10",panel:"#0e1520",card:"#131c28",border:"#1a2840",accent:"#00d4ff",green:"#00e676",yellow:"#ffd600",red:"#ff3d57",orange:"#ff9100",purple:"#c07aff",cash:"#00e676",cardC:"#00d4ff",whatnot:"#ff6ec7",text:"#e8f4fd",muted:"#3d5a78",dim:"#1e2d3d"};
const PAY=[{id:"cash",label:"💵 Cash",emoji:"💵",color:C.cash},{id:"card",label:"💳 Tarjeta",emoji:"💳",color:C.cardC},{id:"whatnot",label:"📦 Whatnot",emoji:"📦",color:C.whatnot},{id:"gift",label:"🎁 Gift",emoji:"🎁",color:C.purple}];
const fmt=n=>('$'+Number(n).toFixed(2));
const genId=()=>Math.random().toString(36).substr(2,9);
const genCode=()=>Math.random().toString(36).substr(2,6).toUpperCase();
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):d;}catch{return d;}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}};
const api={post:(p,b)=>fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()),get:(p)=>fetch(p).then(r=>r.json())};
function App(){
  const [sessionId,setSessionId]=useState(()=>LS.get('pos_session',null));
  const [entryCode,setEntryCode]=useState(()=>genCode());
  const [manifests,setManifests]=useState([]);
  const [upcMap,setUpcMap]=useState(()=>LS.get('pos_upc_map',{}));
  const [activeId,setActiveId]=useState(()=>LS.get('pos_active_manifest',null));
  const [appMode,setAppMode]=useState(()=>LS.get('pos_app_mode','receiving'));
  const [page,setPage]=useState(()=>LS.get('pos_page','home'));
  const [received,setReceived]=useState({});
  const [damaged,setDamaged]=useState({});
  const [salesLog,setSalesLog]=useState([]);
  const [cart,setCart]=useState([]);
  const [checkoutOpen,setCheckoutOpen]=useState(false);
  const [cartTotal,setCartTotal]=useState('');
  const [checkingOut,setCheckingOut]=useState(false);
  const [lastResult,setLastResult]=useState(null);
  const [flash,setFlash]=useState(null);
  const [manualInput,setManualInput]=useState('');
  const [scanMode,setScanMode]=useState('item');
  const [cameraActive,setCameraActive]=useState(false);
  const [camError,setCamError]=useState('');
  const [upcPending,setUpcPending]=useState(null);
  const [upcInput,setUpcInput]=useState('');
  const [pendingSale,setPendingSale]=useState(null);
  const [salePrice,setSalePrice]=useState('');
  const [hasBD]=useState(()=>'BarcodeDetector' in window);
  const [syncDot,setSyncDot]=useState('');
  const videoRef=useRef(null),streamRef=useRef(null),detRef=useRef(null);
  const scanningRef=useRef(false),lastCodeRef=useRef(null),lastTimeRef=useRef(0);
  const manualRef=useRef(null),upcRef=useRef(null),priceRef=useRef(null),evsRef=useRef(null),fileRef=useRef(null);
  
  const eyoyoGlobalBufferRef=useRef('');
  const eyoyoGlobalTimerRef=useRef(null);
  
  const isIOSDevice=()=>{
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  };

  const activeManifest=useMemo(()=>manifests.find(m=>m.id===activeId),[manifests,activeId]);
  const mMap=useMemo(()=>{const map={};activeManifest&&activeManifest.items&&activeManifest.items.forEach(i=>map[i.itemNum]=i);return map;},[activeManifest]);
  const stock=useMemo(()=>{
    const s={};

    if(!activeManifest||!activeManifest.items)return s;

    activeManifest.items.forEach(i=>{
      const rec=Number(received[i.itemNum]||0);
      const dmg=Number(damaged[i.itemNum]||0);
      s[i.itemNum]=Math.max(0,rec-dmg);
    });

    salesLog.forEach(t=>{
      const k=t.item_num||t.itemNum;
      if(s[k]!==undefined)s[k]=Math.max(0,s[k]-1);
    });

    return s;
  },[activeManifest,received,damaged,salesLog]);

  const loadManifests=useCallback(async sid=>{try{const d=await api.get('/api/manifests/'+sid);if(Array.isArray(d))setManifests(d.map(m=>({...m,items:m.items||[]})));}catch(e){console.error(e);}},[]);
  const loadBarcodes=useCallback(async sid=>{
    if(!sid)return {};

    try{
      const d=await api.get('/api/barcodes/'+sid);

      if(d&&d.map){
        const merged=Object.assign({},LS.get('pos_upc_map',{}),d.map);

        LS.set('pos_upc_map',merged);
        setUpcMap(merged);

        return merged;
      }
    }catch(e){
      console.error(e);
    }

    return LS.get('pos_upc_map',{});
  },[]);

  const syncLocalBarcodesToDB=useCallback(async sid=>{
    if(!sid)return;

    const localMap=LS.get('pos_upc_map',{}) || {};
    const entries=Object.entries(localMap).filter(([barcode,itemNum])=>{
      return String(barcode||'').trim() && String(itemNum||'').trim();
    });

    if(entries.length===0)return;

    try{
      for(const [barcode,itemNum] of entries){
        await api.post('/api/barcode',{
          session_id:sid,
          barcode:String(barcode).trim(),
          item_num:String(itemNum).trim()
        });
      }

      console.log('Local learned barcodes synced to DB:',entries.length);
    }catch(e){
      console.log('Barcode sync error:',e.message);
    }
  },[]);

  useEffect(()=>{
    if(!sessionId)return;

    loadBarcodes(sessionId);
    syncLocalBarcodesToDB(sessionId);
  },[sessionId,loadBarcodes,syncLocalBarcodesToDB]);


  useEffect(()=>{if(sessionId){loadManifests(sessionId);loadBarcodes(sessionId);}},[sessionId]);
  const loadData=useCallback(async mId=>{
    if(!mId||!sessionId)return;

    try{
      const d=await api.get('/api/data/'+sessionId+'/'+mId);

      const rm={};
      (d.received||[]).forEach(r=>{
        rm[r.item_num]=r.qty;
      });

      const dm={};
      (d.damaged||[]).forEach(r=>{
        dm[r.item_num]=r.qty;
      });

      setReceived(rm);
      setDamaged(dm);
      setSalesLog(d.sales||[]);

      LS.set('pos_rcv_'+mId,rm);
      LS.set('pos_dmg_'+mId,dm);
      LS.set('pos_sales_'+mId,d.sales||[]);
    }catch{
      setReceived(LS.get('pos_rcv_'+mId,{}));
      setDamaged(LS.get('pos_dmg_'+mId,{}));
      setSalesLog(LS.get('pos_sales_'+mId,[]));
    }
  },[sessionId]);

  useEffect(()=>{if(!activeId||!sessionId)return;setReceived({});setSalesLog([]);setLastResult(null);loadData(activeId);if(evsRef.current)evsRef.current.close();const evs=new EventSource('/api/events/'+sessionId);evsRef.current=evs;evs.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='receive'&&d.manifest_id===activeId){setReceived(prev=>({...prev,[d.item_num]:d.qty}));setSyncDot('ok');setTimeout(()=>setSyncDot(''),1500);}if(d.type==='sale'&&d.manifest_id===activeId){setSalesLog(prev=>[d,...prev]);setSyncDot('ok');setTimeout(()=>setSyncDot(''),1500);}}catch{}};return()=>{evs.close();};},[activeId,sessionId]);
  useEffect(()=>{LS.set('pos_upc_map',upcMap);},[upcMap]);
  useEffect(()=>{
    if(!sessionId)return;
    loadBarcodes(sessionId);
  },[sessionId,page,activeId,loadBarcodes]);


  const onFile=e=>{const file=e.target.files[0];if(!file)return;e.target.value='';Papa.parse(file,{header:true,skipEmptyLines:true,complete:({data})=>{const items=data.map(r=>({itemNum:r['Item #']&&r['Item #'].trim(),description:(r['Item Description']&&r['Item Description'].trim())||'—',qty:parseInt(r['Qty'])||0,unitRetail:parseFloat(r['Unit Retail'])||0,brand:(r['Brand']&&r['Brand'].trim())||(r['Vendor']&&r['Vendor'].trim())||'—'})).filter(i=>i.itemNum);const nm={id:genId(),session_id:sessionId,name:file.name.replace('.csv','').replace(/_/g,' ').substring(0,45),uploadedAt:new Date().toLocaleDateString('en-US'),items};api.post('/api/manifest',nm).catch(console.error);setManifests(p=>[nm,...p]);setActiveId(nm.id);setAppMode('receiving');setPage('recv');}});};
  useEffect(()=>{if((page==='recv'||page==='pos')&&hasBD&&!detRef.current){try{detRef.current=new window.BarcodeDetector({formats:['ean_13','upc_a','upc_e','code_128','code_39','qr_code']});}catch{try{detRef.current=new window.BarcodeDetector();}catch{}}};},[page,hasBD]);
  const startCam=async()=>{setCamError('');try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920}}});streamRef.current=s;if(videoRef.current){videoRef.current.srcObject=s;await videoRef.current.play();}setCameraActive(true);scanningRef.current=true;camLoop();}catch(e){setCamError('Sin acceso: '+e.message);}};
  const stopCam=()=>{scanningRef.current=false;streamRef.current&&streamRef.current.getTracks().forEach(t=>t.stop());streamRef.current=null;setCameraActive(false);};
  const camLoop=async()=>{if(!scanningRef.current||!detRef.current||!videoRef.current)return;if(videoRef.current.readyState>=2){try{const codes=await detRef.current.detect(videoRef.current);if(codes.length>0){onScan(codes[0].rawValue);await new Promise(r=>setTimeout(r,1500));}}catch{}}if(scanningRef.current)requestAnimationFrame(camLoop);};
  useEffect(()=>()=>stopCam(),[]);
  const audioCtxRef=useRef(null);

  const getAudioCtx=()=>{
    try{
      const AudioContext=window.AudioContext||window.webkitAudioContext;
      if(!AudioContext)return null;

      if(!audioCtxRef.current){
        audioCtxRef.current=new AudioContext();
      }

      const ctx=audioCtxRef.current;

      if(ctx.state==='suspended'){
        ctx.resume().catch(()=>{});
      }

      return ctx;
    }catch{
      return null;
    }
  };

  const playTone=(freq,duration=0.08,volume=0.16,delay=0,type='square')=>{
    try{
      const ctx=getAudioCtx();
      if(!ctx)return;

      const osc=ctx.createOscillator();
      const gain=ctx.createGain();

      const startAt=ctx.currentTime+delay;
      const endAt=startAt+duration;

      osc.type=type;
      osc.frequency.setValueAtTime(freq,startAt);

      gain.gain.setValueAtTime(0.001,startAt);
      gain.gain.exponentialRampToValueAtTime(volume,startAt+0.01);
      gain.gain.exponentialRampToValueAtTime(0.001,endAt);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(startAt);
      osc.stop(endAt+0.02);
    }catch{}
  };

  const playScannerBeep=()=>{
    // Beep corto tipo scanner
    playTone(1450,0.075,0.18,0,'square');
  };

  const playErrorBeep=()=>{
    // Beep grave doble
    playTone(220,0.14,0.22,0,'sawtooth');
    playTone(180,0.14,0.22,0.20,'sawtooth');
  };

  const playCashRegister=()=>{
    // Sonido tipo cash register / checkout completado
    playTone(880,0.07,0.14,0,'triangle');
    playTone(1175,0.08,0.14,0.09,'triangle');
    playTone(1568,0.16,0.16,0.19,'triangle');
    playTone(660,0.12,0.10,0.36,'sine');
  };

  useEffect(()=>{
    const unlock=()=>{
      try{
        getAudioCtx();
      }catch{}

      window.removeEventListener('pointerdown',unlock);
      window.removeEventListener('touchstart',unlock);
      window.removeEventListener('click',unlock);
    };

    window.addEventListener('pointerdown',unlock,{once:true});
    window.addEventListener('touchstart',unlock,{once:true});
    window.addEventListener('click',unlock,{once:true});

    return()=>{
      window.removeEventListener('pointerdown',unlock);
      window.removeEventListener('touchstart',unlock);
      window.removeEventListener('click',unlock);
    };
  },[]);

  const pulse=type=>{
    setFlash(type==='miss'?'miss':'ok');
    setTimeout(()=>setFlash(null),350);

    if(type==='checkout'||type==='gift'){
      playCashRegister();
    }else if(type==='ok'){
      playScannerBeep();
    }else{
      playErrorBeep();
    }

    if(navigator.vibrate){
      if(type==='checkout'||type==='gift'){
        navigator.vibrate([80,40,120]);
      }else if(type==='ok'){
        navigator.vibrate([60]);
      }else{
        navigator.vibrate([90,50,90]);
      }
    }
  };

  const processCode=useCallback(async itemNum=>{
  itemNum=itemNum.toString().trim();

  if(appMode==='receiving'){
    const item=mMap[itemNum];

    if(!item){
      setLastResult({itemNum,status:'miss'});
      pulse('miss');
      return;
    }

    setReceived(prev=>{
      const newQty=(prev[itemNum]||0)+1;
      const newRcv=Object.assign({},prev,{[itemNum]:newQty});

      setLastResult(Object.assign({},item,{status:'found'}));
      pulse('ok');
      LS.set('pos_rcv_'+activeId,newRcv);

      api.post('/api/receive',{
        session_id:sessionId,
        manifest_id:activeId,
        item_num:itemNum,
        qty:newQty
      }).then(()=>{
        setSyncDot('ok');
        setTimeout(()=>setSyncDot(''),1500);
      }).catch(()=>setSyncDot('err'));

      return newRcv;
    });

  }else{
    const item=mMap[itemNum];

    if(!item){
      setLastResult({itemNum,status:'miss'});
      pulse('miss');
      return;
    }

    const line=cart.find(l=>l.item.itemNum===itemNum);
    const inCart=line?line.qty:0;

    if((stock[itemNum]||0)-inCart<=0){
      setLastResult(Object.assign({},item,{status:'nostock'}));
      pulse('miss');
      return;
    }

    setCart(prev=>{
      const exists=prev.find(l=>l.item.itemNum===item.itemNum);
      if(exists){
        return prev.map(l=>l.item.itemNum===item.itemNum?Object.assign({},l,{qty:l.qty+1}):l);
      }
      return [...prev,{item,qty:1,price:Number(item.unitRetail)||0}];
    });

    setLastResult(Object.assign({},item,{status:'found'}));
    pulse('ok');
  }
},[appMode,mMap,stock,cart,activeId,sessionId]);

  const handleScannedBarcode=useCallback(async raw=>{
  raw=String(raw||'').trim();
  if(!raw)return;

  const findLearnedItem=(map,code)=>{
    if(!map)return '';

    if(map[code])return map[code];

    const norm=String(code).replace(/^0+/,'');

    const key=Object.keys(map).find(k=>{
      return String(k).replace(/^0+/,'')===norm;
    });

    return key ? map[key] : '';
  };

  let latestMap=Object.assign({},LS.get('pos_upc_map',{}),upcMap||{});
  let learnedItem=findLearnedItem(latestMap,raw);

  // Si no lo encuentra localmente, consulta la base de datos antes de pedir Item #
  if(!learnedItem && sessionId){
    try{
      const d=await api.get('/api/barcodes/'+sessionId);

      if(d&&d.map){
        latestMap=Object.assign({},latestMap,d.map);

        LS.set('pos_upc_map',latestMap);
        setUpcMap(latestMap);

        learnedItem=findLearnedItem(latestMap,raw);
      }
    }catch(e){
      console.log('Barcode lookup DB error',e.message);
    }
  }

  if(learnedItem){
    const cleanItem=String(learnedItem).trim().replace(/^#/,'');

    if(mMap[cleanItem]){
      processCode(cleanItem);
      return;
    }

    alert(
      'Este barcode está asociado al Item # '+cleanItem+
      ', pero ese Item # no está en este manifiesto. Verifica el manifiesto o corrige el barcode.'
    );

    setUpcPending(raw);
    setUpcInput('');
    stopCam();
    setTimeout(()=>upcRef.current&&upcRef.current.focus(),100);
    return;
  }

  setUpcPending(raw);
  setUpcInput('');
  stopCam();
  setTimeout(()=>upcRef.current&&upcRef.current.focus(),100);
},[upcMap,mMap,processCode,sessionId]);

  const onScan=useCallback(raw=>{
  raw=raw.toString().trim();

  const now=Date.now();

  if(raw===lastCodeRef.current&&now-lastTimeRef.current<1500)return;

  lastCodeRef.current=raw;
  lastTimeRef.current=now;

  handleScannedBarcode(raw);
},[handleScannedBarcode]);

  const confirmUpc=()=>{const n=upcInput.trim();if(!n||!upcPending)return;const b=upcPending;setUpcMap(p=>Object.assign({},p,{[b]:n}));api.post('/api/barcode',{session_id:sessionId,barcode:b,item_num:n}).catch(()=>setSyncDot('err'));processCode(n,b);setUpcPending(null);setUpcInput('');setTimeout(startCam,300);};
useEffect(()=>{
    const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);

    const removeOld=()=>{
      ['pos-ios-item-keypad-v2','pos-inline-ios-keypad','pos-upc-keypad','pos-upc-keypad-toggle'].forEach(id=>{
        const el=document.getElementById(id);
        if(el)el.remove();
      });
    };

    removeOld();

    if(!isIOS)return;
    if(!upcPending)return;

    let mounted=true;
    let tries=0;

    const createKeypad=()=>{
      if(!mounted)return;

      tries++;

      if(!upcRef.current){
        if(tries<30)setTimeout(createKeypad,100);
        return;
      }

      const input=upcRef.current;
      const parent=input.parentElement;

      if(!parent){
        if(tries<30)setTimeout(createKeypad,100);
        return;
      }

      removeOld();

      let keypadValue=String(upcInput||'');

      const wrap=document.createElement('div');
      wrap.id='pos-ios-item-keypad-v2';
      wrap.style.marginTop='10px';
      wrap.style.background=C.card;
      wrap.style.border='1px solid '+C.accent;
      wrap.style.borderRadius='12px';
      wrap.style.padding='10px';
      wrap.style.width='100%';
      wrap.style.boxSizing='border-box';
      wrap.style.fontFamily='monospace';

      const title=document.createElement('div');
      title.textContent='Teclado numérico iPhone';
      title.style.color=C.accent;
      title.style.fontSize='11px';
      title.style.fontWeight='800';
      title.style.textAlign='center';
      title.style.letterSpacing='1px';
      title.style.textTransform='uppercase';
      title.style.marginBottom='8px';
      wrap.appendChild(title);

      const syncInput=()=>{
        setUpcInput(keypadValue);
        try{
          input.value=keypadValue;
        }catch{}
      };

      const submit=()=>{
        const n=keypadValue.trim();
        const barcode=(upcPending||'').toString().trim();

        if(!n||!barcode)return;

        if(!mMap[n]){
          alert('Ese Item # no existe en este manifiesto. Verifica el número.');
          return;
        }

        const newMap=Object.assign({},upcMap,{[barcode]:n});

        setUpcMap(newMap);
        LS.set('pos_upc_map',newMap);

        setUpcPending(null);
        setUpcInput('');

        removeOld();
        processCode(n);

        setTimeout(()=>{
          manualRef.current&&manualRef.current.focus();
        },150);
      };

      const makeBtn=(txt,fn,bg,color)=>{
        const b=document.createElement('button');
        b.type='button';
        b.textContent=txt;
        b.style.background=bg||C.panel;
        b.style.color=color||C.text;
        b.style.border='1px solid '+C.border;
        b.style.borderRadius='10px';
        b.style.padding='12px 8px';
        b.style.fontSize='17px';
        b.style.fontWeight='800';
        b.style.fontFamily='monospace';
        b.style.cursor='pointer';
        b.onclick=fn;
        return b;
      };

      const grid=document.createElement('div');
      grid.style.display='grid';
      grid.style.gridTemplateColumns='1fr 1fr 1fr';
      grid.style.gap='7px';

      ['1','2','3','4','5','6','7','8','9'].forEach(n=>{
        grid.appendChild(makeBtn(n,()=>{
          keypadValue+=n;
          syncInput();
        }));
      });

      grid.appendChild(makeBtn('⌫',()=>{
        keypadValue=keypadValue.slice(0,-1);
        syncInput();
      },C.red+'22',C.red));

      grid.appendChild(makeBtn('0',()=>{
        keypadValue+='0';
        syncInput();

    try{
      if(!activeId||!activeManifest){
        alert('Primero abre el manifiesto donde quieres recuperar las ventas.');

      }

      const keys=Object.keys(localStorage).filter(k=>k.startsWith('pos_sales_'));

      let candidates=found.filter(tx=>{
        const itemNum=String(tx.item_num||tx.itemNum||'').trim();
        if(!itemNum)return false;
        if(!mMap[itemNum])return false;

        const d=String(tx.sale_date||tx.sale_datetime||tx.created_at||'').slice(0,10);
        return d===today;
      });

      if(candidates.length===0){
        const allForManifest=found.filter(tx=>{
          const itemNum=String(tx.item_num||tx.itemNum||'').trim();
          return itemNum && mMap[itemNum];
        });

        if(allForManifest.length===0){
          alert(
            'Encontré '+found.length+' ventas locales, pero ninguna coincide con los items de este manifiesto.'
          );
          return;

        );

        if(!okAll)return;
        candidates=allForManifest;

      const txs=[];

          pay_method:tx.pay_method||tx.payMethod||'cash',

          sale_time:saleTime,
          time:saleTime,
          sale_date:saleDate,
          sale_datetime:saleDateTime,
          manifest_id:activeId,
          created_at:tx.created_at||saleDateTime
        };

        const key=String(clean.id)+'|'+String(clean.item_num)+'|'+String(clean.sale_datetime||clean.created_at||clean.sale_time);

        if(!existing.has(key)){
          existing.add(key);
          txs.push(clean);
        }
      });

      if(txs.length===0){
        alert('Las ventas locales encontradas ya parecen estar cargadas en esta pantalla.');
        return;
      }

      const ok=confirm(
        'Encontré '+txs.length+' ventas locales para recuperar.\\n\\n'+
        'Se van a subir al manifiesto abierto ahora.\\n\\n'+
        '¿Continuar?'
      );

      if(!ok)return;

      let uploaded=0;

          id:tx.id,

          sale_time:tx.sale_time,
          sale_date:tx.sale_date,
          sale_datetime:tx.sale_datetime

        uploaded++;

      const newSales=[...txs,...salesLog];
      setSalesLog(newSales);
      LS.set('pos_sales_'+activeId,newSales);

      setSyncDot('ok');
      setTimeout(()=>setSyncDot(''),1500);

      alert('Listo. Recuperé '+uploaded+' ventas locales.');
    }catch(e){
      console.error(e);
      setSyncDot('err');
      alert('No pude recuperar ventas locales: '+e.message);
    }
  };

  const openSquarePOS=(amount, note)=>{
    const cents=Math.round((Number(amount)||0)*100);

    if(cents<=0){
      alert('El total debe ser mayor de $0.00 para cobrar con Square.');
      return false;
    }

    const callbackUrl=getSquareCallbackUrl();

    if(isIOS()){
      const data={
        amount_money:{
          amount:cents,
          currency_code:'USD'
        },
        callback_url:callbackUrl,
        client_id:SQUARE_APP_ID,
        version:'1.3',
        notes:note||'Klou POS sale',
        options:{
          supported_tender_types:['CREDIT_CARD'],
          clear_default_fees:true,
          auto_return:true,
          skip_receipt:false
        }
      };

      const url='square-commerce-v1://payment/create?data='+
        encodeURIComponent(JSON.stringify(data));

      window.location.href=url;
      return true;
    }

    if(isAndroid()){
      const callback=encodeURIComponent(callbackUrl);
      const fallback=encodeURIComponent(window.location.href);

      const url=
        'intent:#Intent;' +
        'action=com.squareup.pos.action.CHARGE;' +
        'package=com.squareup;' +
        'S.browser_fallback_url=' + fallback + ';' +
        'S.com.squareup.pos.WEB_CALLBACK_URI=' + callback + ';' +
        'S.com.squareup.pos.CLIENT_ID=' + SQUARE_APP_ID + ';' +
        'S.com.squareup.pos.API_VERSION=v2.0;' +
        'i.com.squareup.pos.TOTAL_AMOUNT=' + cents + ';' +
        'S.com.squareup.pos.CURRENCY_CODE=USD;' +
        'S.com.squareup.pos.TENDER_TYPES=com.squareup.pos.TENDER_CARD;' +
        'end';

      window.location.href=url;
      return true;
    }

    alert('Square POS solo se abre automáticamente desde iPhone o Android con la app de Square instalada.');
    return false;
  };

      'Actual recibido:',
      String(currentQty||0)
    );

    if(answer===null)return;

    const qty=Math.max(0,parseInt(answer,10)||0);

    setReceived(newRcv);
    LS.set('pos_rcv_'+activeId,newRcv);

  const confirmCartCheckout=async payMethod=>{
    if(checkingOut||cartQty<=0)return;

    const units=[];
    cart.forEach(line=>{
      for(let i=0;i<(Number(line.qty)||0);i++){
        units.push({item:line.item,price:Number(line.price)||0});
      }
    });

    if(units.length===0)return;

    const subtotal=units.reduce((sum,u)=>sum+Number(u.price||0),0);
    const finalTotal=payMethod==='gift'?0:(parseFloat(cartTotal)||subtotal||0);

    if(payMethod==='card'){
      const ok=window.confirm(
        'Se abrirá Square para cobrar $'+Number(finalTotal||0).toFixed(2)+
        '.\n\nDespués de cobrar, vuelve a Klou POS. La venta quedará registrada como Tarjeta.'
      );

      if(!ok)return;

      openSquarePOS(finalTotal,'Klou POS - '+cartQty+' item(s)');
    }
    const totalCents=Math.round(finalTotal*100);
    let remainingCents=totalCents;

    const now=new Date();
    const time=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const createdAt=now.toISOString();

    const txs=units.map((u,i)=>{
      let cents;
      if(i===units.length-1){
        cents=remainingCents;
      }else if(subtotal>0){
        cents=Math.round((Number(u.price||0)/subtotal)*totalCents);
        remainingCents-=cents;
      }else{
        cents=Math.round(totalCents/units.length);
        remainingCents-=cents;
      }

      const price=Math.max(0,cents)/100;
      const id=genId();

      return {
        id,
        item_num:u.item.itemNum,
        itemNum:u.item.itemNum,
        description:u.item.description,
        brand:u.item.brand,
        price,
        pay_method:payMethod,
        payMethod:payMethod,
        sale_time:time,
        time,
        manifest_id:activeId,
        created_at:createdAt
      };
    });

    setCheckingOut(true);

    try{
      const responses=await Promise.all(txs.map(tx=>api.post('/api/sale',{
        id:tx.id,
        session_id:sessionId,
        manifest_id:activeId,
        item_num:tx.item_num,
        description:tx.description,
        brand:tx.brand,
        price:tx.price,
        pay_method:tx.pay_method,
        sale_time:tx.sale_time
      })));

      const err=responses.find(r=>r&&r.error);
      if(err)throw new Error(err.error);

      const newSales=[...txs,...salesLog];
      setSalesLog(newSales);
      LS.set('pos_sales_'+activeId,newSales);

      setCart([]);
      setCheckoutOpen(false);
      setCartTotal('');

      pulse(payMethod==='gift'?'gift':'checkout');

      setSyncDot('ok');
      setTimeout(()=>setSyncDot(''),1500);

      setSyncDot('err');
    }finally{

    }
  };

          const y=d.getFullYear();
          const m=String(d.getMonth()+1).padStart(2,'0');
          const day=String(d.getDate()).padStart(2,'0');
          return y+'-'+m+'-'+day;
        }
      }
    }catch{}
    return todayISO();
  };

        'Description',
        'Brand',
        'Expected Qty',
        'Received Total',
        'Damaged Qty',
        'Vendible',
        'Missing Qty',
        'Unit Retail',
        'Expected Total',
        'Loss Value',
        'Status'
      ]
    ];

    activeManifest.items.forEach(item=>{
      const expected=Number(item.qty)||0;
      const rec=Number(latestReceived[item.itemNum] ?? received[item.itemNum] ?? 0);
      const dmgRaw=Number(latestDamaged[item.itemNum] ?? damaged[item.itemNum] ?? 0);
      const dmg=Math.min(rec,Math.max(0,dmgRaw));
      const sellable=Math.max(0,rec-dmg);
      const missing=Math.max(0,expected-rec);
      const unit=Number(item.unitRetail)||0;

      let status='OK';

      if(dmg>0 && sellable===0){
        status='ALL DAMAGED';
      }else if(dmg>0){
        status='DAMAGED';
      }

      if(missing>0){
        status=dmg>0 ? status+' / MISSING' : 'MISSING';
      }

      if(rec>expected){
        status=dmg>0 ? status+' / OVER' : 'OVER RECEIVED';
      }

      rows.push([
        item.itemNum,
        item.description||'',
        item.brand||'',
        expected,
        rec,
        dmg,
        sellable,
        missing,
        unit.toFixed(2),
        (expected*unit).toFixed(2),
        (dmg*unit).toFixed(2),
        status
      ]);
    });

    const totalExpected=activeManifest.items.reduce((sum,item)=>sum+(Number(item.qty)||0),0);

    const totalReceived=activeManifest.items.reduce((sum,item)=>{
      return sum+Number(latestReceived[item.itemNum] ?? received[item.itemNum] ?? 0);
    },0);

    const totalDamaged=activeManifest.items.reduce((sum,item)=>{
      const rec=Number(latestReceived[item.itemNum] ?? received[item.itemNum] ?? 0);
      const dmgRaw=Number(latestDamaged[item.itemNum] ?? damaged[item.itemNum] ?? 0);
      return sum+Math.min(rec,Math.max(0,dmgRaw));
    },0);

    const totalSellable=activeManifest.items.reduce((sum,item)=>{
      const rec=Number(latestReceived[item.itemNum] ?? received[item.itemNum] ?? 0);
      const dmgRaw=Number(latestDamaged[item.itemNum] ?? damaged[item.itemNum] ?? 0);
      const dmg=Math.min(rec,Math.max(0,dmgRaw));
      return sum+Math.max(0,rec-dmg);
    },0);

    const totalMissing=activeManifest.items.reduce((sum,item)=>{
      const rec=Number(latestReceived[item.itemNum] ?? received[item.itemNum] ?? 0);
      return sum+Math.max(0,(Number(item.qty)||0)-rec);
    },0);

    const totalLoss=activeManifest.items.reduce((sum,item)=>{
      const rec=Number(latestReceived[item.itemNum] ?? received[item.itemNum] ?? 0);
      const dmgRaw=Number(latestDamaged[item.itemNum] ?? damaged[item.itemNum] ?? 0);
      const dmg=Math.min(rec,Math.max(0,dmgRaw));
      return sum+(dmg*(Number(item.unitRetail)||0));
    },0);

    rows.push([]);
    rows.push([
      'TOTALS',
      '',
      '',
      totalExpected,
      totalReceived,
      totalDamaged,
      totalSellable,
      totalMissing,
      '',
      '',
      totalLoss.toFixed(2),
      ''
    ]);

    downloadCSV(
      'recibido_vs_esperado_'+safeFileName(activeManifest.name)+'_'+todayISO()+'.csv',
      rows
    );
  };

  useEffect(()=>{
    if(page!=='summary')return;
    if(upcPending||pendingSale)return;
    if(typeof checkoutOpen!=='undefined' && checkoutOpen)return;

    const focusScanner=()=>{
      if(isIOSDevice())return;

      try{
        if(manualRef.current && document.activeElement !== manualRef.current){
          manualRef.current.focus();
        }
      }catch{}
    };

    focusScanner();

    const focusTimer=setInterval(focusScanner,800);

    const handleGlobalScan=e=>{
      if(page!=='summary')return;
      if(upcPending||pendingSale)return;
      if(typeof checkoutOpen!=='undefined' && checkoutOpen)return;

      const active=document.activeElement;
      const isTypingField=active && (
        active.tagName==='INPUT' ||
        active.tagName==='TEXTAREA' ||
        active.isContentEditable
      );

      // Si estás escribiendo en otro campo, no interrumpimos.
      // Si el campo activo es el scanner manual, dejamos que el formulario normal trabaje.
      if(isTypingField){
        if(active===manualRef.current)return;
        return;
      }

      if(e.key==='Enter'){
        const code=eyoyoGlobalBufferRef.current.trim();
        eyoyoGlobalBufferRef.current='';

        if(code.length>=3){
          e.preventDefault();

          if(mMap[code]){
            processCode(code);
          }else if(upcMap[code]){
            processCode(upcMap[code]);
          }else{
            setUpcPending(code);
            stopCam();
            setTimeout(()=>upcRef.current&&upcRef.current.focus(),100);
          }

          setTimeout(()=>manualRef.current&&manualRef.current.focus(),200);
        }

        return;
      }

      if(e.key && e.key.length===1){
        eyoyoGlobalBufferRef.current += e.key;

        clearTimeout(eyoyoGlobalTimerRef.current);
        eyoyoGlobalTimerRef.current=setTimeout(()=>{
          eyoyoGlobalBufferRef.current='';
        },300);
      }
    };

    document.addEventListener('keydown',handleGlobalScan,true);

    return()=>{
      clearInterval(focusTimer);
      clearTimeout(eyoyoGlobalTimerRef.current);
      document.removeEventListener('keydown',handleGlobalScan,true);
    };
  },[page,activeManifest,upcPending,pendingSale,mMap,upcMap,processCode]);

  const bg=flash==='ok'?'#041208':flash==='miss'?'#120408':C.bg;

          React.createElement('div',{style:{fontSize:12,fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},t.description),

        PAY.map(p=>React.createElement('div',{key:p.id,style:{background:C.card,borderRadius:8,padding:'8px',border:'1px solid '+p.color+'22',textAlign:'center'}},

          React.createElement('div',{style:{color:C.muted,fontSize:9}},cntByPay[p.id],' uds')
        ))
      ),
      React.createElement('div',{style:{margin:'6px 12px 0',background:'#05101a',border:'1px solid '+C.accent+'33',borderRadius:8,padding:'5px 12px',display:'flex',alignItems:'center',gap:8}},
        React.createElement('span',{style:{width:8,height:8,borderRadius:'50%',background:C.accent,display:'inline-block'}}),
        React.createElement('span',{style:{color:C.accent,fontSize:11,fontWeight:700,letterSpacing:2,textTransform:'uppercase',flex:1}},'VENTA'),
        React.createElement('span',{style:{color:C.muted,fontSize:10,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:'60%'}},(activeManifest&&activeManifest.name)||'')
      ),
      ResultCard,

      React.createElement('div',{style:{flex:1,overflow:'auto',margin:'8px 12px 12px'}},
        salesLog.length>0&&React.createElement('div',null,
          React.createElement('div',{style:{color:C.muted,fontSize:9,letterSpacing:2,textTransform:'uppercase',marginBottom:6}},'VENTAS (',salesLog.length,')'),
          salesRows
        )
      )
    );
  }
  return React.createElement('div',{style:{minHeight:'100vh',background:C.bg,color:C.red,padding:20}},'Página no encontrada');
}
